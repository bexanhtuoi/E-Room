# Reverse proxy noi bo cho Tailscale Funnel (TLS ket thuc o Tailscale edge).
# 1 public URL duy nhat: / -> frontend, /api -> api, /rtc* + /validate* -> livekit.
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Docker DNS (resolve dynamic de nginx len duoc truoc cac service khac)
    resolver 127.0.0.11 valid=10s;

    server {
        listen 80;

        location /api/ {
            set $upstream_api api:8000;
            proxy_pass http://$upstream_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # LiveKit signaling (WebSocket) + validate (HTTP)
        location /rtc {
            set $upstream_lk livekit:7880;
            proxy_pass http://$upstream_lk;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        location /validate {
            set $upstream_lk livekit:7880;
            proxy_pass http://$upstream_lk;
            proxy_set_header Host $host;
        }

        # Assets hash theo content -> cache 1 nam
        location /assets/ {
            set $upstream_fe frontend:3000;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            proxy_pass http://$upstream_fe;
            proxy_set_header Host $host;
        }

        # SPA: HTML luon revalidate de deploy moi hien ngay, khoi ket ban cu
        location / {
            set $upstream_fe frontend:3000;
            add_header Cache-Control "no-cache" always;
            proxy_pass http://$upstream_fe;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
