[project]
name = "backend"
version = "2.0.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Pham Huy Hoang", email = "23e1020002@hueuni.edu.vn" }
]
requires-python = ">=3.13"
dependencies = [
    "argon2-cffi>=25.1.0",
    "supertonic>=1.3.0",
    "email-validator>=2.3.0",
    "fastapi>=0.136.1",
    "minio>=7.2.20",
    "pydantic-settings>=2.14.0",
    "pyjwt>=2.12.1",
    "pymysql>=1.1.1",
    "cryptography>=44.0.0",
    "redis>=7.4.0",
    "sqlmodel>=0.0.38",
    "uvicorn[standard]>=0.46.0",
    "websockets>=16.0",
    "alembic>=1.18.4",
    "sqlalchemy>=2.0.49",
    "langchain>=1.2.2",
    "langchain-openai>=1.1.7",
    "langchain-community>=0.4.1",
    "langchain-text-splitters>=1.1.0",
    "langgraph>=1.0.5",
    "langgraph-prebuilt>=1.0.5",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.1",
    "stripe>=15.1.0",
    "numpy>=2.0.0",
    "soundfile>=0.13.1",
    "gtts>=2.5.4",
    "colorlog>=6.12.0",
    "passlib>=1.7.4",
    "bcrypt==4.0.1",
    "python-multipart>=0.0.32",
    "celery>=5.6.3",
    "qdrant-client>=1.19.0",
    "pymupdf>=1.28.2",
    "tavily-python>=0.7.27",
    "livekit>=1.1.14",
    # STT local fallback (whisper small chay trong worker khi whisper-server
    # host chet). Nang hon (~500MB ctranslate2) nhung dam bao khong câm.
    "faster-whisper>=1.2.1",
    # Scorer phat am local (port tu demo/pronun-app): torch CPU + transformers +
    # librosa + CMUdict/g2p-en. May chay backend gánh compute.
    "torch>=2.2",
    "transformers>=4.44",
    "librosa>=0.10",
    "pronouncing>=0.3.0",
    "g2p-en>=2.1.0",
    "nltk>=3.8",
    "phonemizer>=3.2.0",
]

[project.scripts]
backend = "backend:main"

[tool.uv]
package = false

# Torch lay tu PyTorch CPU index (nhe hon CUDA ~2GB, du cho scorer).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[build-system]
requires = ["uv_build>=0.9.27,<0.10.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 160
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"app/ai/prompt.py" = ["E501"]
"app/api/routers/auth.py" = ["E501"]

[dependency-groups]
dev = [
    "datasets>=4.8.5",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.11.0",
    "vulture>=2.16",
]
