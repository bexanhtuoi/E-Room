services:
  api:
    build: ./backend
    container_name: api
    command: uv run python -m app.server
    ports:
      - "8000:8000"
    restart: unless-stopped
    env_file: ./backend/.env.docker
    cpus: 2.0
    mem_limit: 2g
    mem_reservation: 768m
    volumes:
      - ./backend/app:/app/app
      - speech_logs:/app/log/speech
    depends_on:
      tidb:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      ollama:
        condition: service_started

  ai-worker:
    build: ./backend
    container_name: ai-worker
    command: uv run celery -A app.integration.celery.celery_app worker --queues=ai --concurrency=4 -O fair --max-tasks-per-child=100 --loglevel=INFO
    restart: unless-stopped
    env_file: ./backend/.env.docker
    cpus: 3.0
    mem_limit: 4g
    mem_reservation: 1536m
    volumes:
      - ./backend/app:/app/app
      - speech_logs:/app/log/speech
      - hf_cache:/root/.cache/huggingface
    depends_on:
      redis:
        condition: service_healthy
      livekit:
        condition: service_started

  ai-beat:
    build: ./backend
    container_name: ai-beat
    command: uv run celery -A app.integration.celery.celery_app beat --loglevel=INFO
    restart: unless-stopped
    env_file: ./backend/.env.docker
    cpus: 0.5
    mem_limit: 1g
    mem_reservation: 256m
    volumes:
      - ./backend/app:/app/app
    depends_on:
      redis:
        condition: service_healthy

  beszel-hub:
    image: henrygd/beszel:0.18
    container_name: beszel-hub
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 256m
    mem_reservation: 64m
    ports:
      - "8090:8090"
    volumes:
      - beszel_data:/beszel_data

  beszel-agent:
    image: henrygd/beszel-agent:0.18
    container_name: beszel-agent
    restart: unless-stopped
    cpus: 0.2
    mem_limit: 128m
    mem_reservation: 32m
    network_mode: host
    environment:
      # Lay KEY that (ssh-ed25519...) trong Beszel → Add System, roi dien vao .env
      # hoac export BESZEL_AGENT_KEY truoc khi up.
      KEY: ${BESZEL_AGENT_KEY:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  uptime-kuma:
    image: louislam/uptime-kuma:2
    container_name: uptime-kuma
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 512m
    mem_reservation: 128m
    ports:
      - "8091:3001"
    volumes:
      - uptime_kuma_data:/app/data

  ai-observer:
    build: ./backend
    container_name: ai-observer
    command: uv run celery -A app.integration.celery.celery_app worker --queues=ai_observer --concurrency=2 -O fair --max-tasks-per-child=100 --loglevel=INFO
    restart: unless-stopped
    env_file: ./backend/.env.docker
    cpus: 1.0
    mem_limit: 1536m
    mem_reservation: 384m
    volumes:
      - ./backend/app:/app/app
    depends_on:
      redis:
        condition: service_healthy
      livekit:
        condition: service_started

  ai-transcriber:
    build: ./backend
    container_name: ai-transcriber
    command: uv run celery -A app.integration.celery.celery_app worker --queues=ai_transcriber --pool=threads --concurrency=50 --loglevel=INFO
    restart: unless-stopped
    env_file: ./backend/.env.docker
    cpus: 4.0
    mem_limit: 4g
    mem_reservation: 1536m
    volumes:
      - ./backend/app:/app/app
      - speech_logs:/app/log/speech
      - hf_cache:/root/.cache/huggingface
    depends_on:
      redis:
        condition: service_healthy
      livekit:
        condition: service_started

  tidb:
    image: pingcap/tidb:v8.5.0
    container_name: tidb
    restart: unless-stopped
    cpus: 2.0
    mem_limit: 3g
    mem_reservation: 512m
    ports:
      - "4000:4000"
      - "10080:10080"
    command:
      - --store=unistore
      - --path=/data
    volumes:
      - tidb_data:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:10080/status" ]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  livekit:
    image: livekit/livekit-server:latest
    container_name: livekit
    command: --config /etc/livekit.yaml --node-ip 192.168.1.10
    restart: unless-stopped
    environment:
      NODE_IP: 192.168.1.10
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50100:50000-50100/udp"
      - "3478:3478/udp"
      - "5349:5349"
    volumes:
      - ./backend/livekit.yaml:/etc/livekit.yaml:ro
    depends_on:
      redis:
        condition: service_healthy

  # llama:
  #   image: ghcr.io/ggml-org/llama.cpp:server
  #   container_name: llama
  #   profiles: ["llm-local"]
  #   entrypoint: ["/app/llama-server"]
  #   command: ["-hf", "unsloth/gemma-4-E4B-it-qat-GGUF:UD-Q4_K_XL", "--host", "0.0.0.0", "--port", "8012", "-c", "8192"]
  #   restart: unless-stopped
  #   ports:
  #     - "8012:8012"
  #   volumes:
  #     - llama_data:/root/.cache/huggingface

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    cpus: 2.0
    mem_limit: 2g
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: ["/bin/sh", "-c", "ollama serve > /tmp/ollama.log 2>&1 & sleep 10; ollama pull qwen3-embedding:0.6b; wait"]
    healthcheck:
      test: ["CMD-SHELL", "ollama list | grep -q qwen3-embedding"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 300s

  reranker:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: reranker
    profiles: ["llm-local"]
    entrypoint: ["/app/llama-server"]
    command: ["-hf", "ggml-org/Qwen3-Reranker-0.6B-Q8_0-GGUF", "--host", "0.0.0.0", "--port", "8014", "-c", "4096", "-b", "2048", "-ub", "2048", "--pooling", "rank", "--rerank"]
    restart: unless-stopped
    ports:
      - "8014:8014"
    volumes:
      - reranker_data:/root/.cache/huggingface

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "3001:3000"
    expose:
      - "3000"
    restart: unless-stopped
    depends_on:
      - api

  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    ports:
      - "8080:80"
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - api
      - livekit

volumes:
  redis_data:
  minio_data:
  tidb_data:
  llama_data:
  hf_cache:
  speech_logs:
  qdrant_data:
  ollama_data:
  reranker_data:
  beszel_data:
  uptime_kuma_data:
