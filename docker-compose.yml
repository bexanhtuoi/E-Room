services:
  api:
    build: ./backend
    container_name: api
    command: uv run python -m app.server
    ports:
      - "8000:8000"
    restart: unless-stopped
    env_file: ./backend/.env.docker
    volumes:
      - ./backend/app:/app/app
    depends_on:
      tidb:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      llama:
        condition: service_started

  ai-worker:
    build: ./backend
    container_name: ai-worker
    command: uv run celery -A app.integration.celery.celery_app worker --queues=ai --concurrency=1 --loglevel=INFO
    restart: unless-stopped
    env_file: ./backend/.env.docker
    volumes:
      - ./backend/app:/app/app
    depends_on:
      redis:
        condition: service_healthy
      livekit:
        condition: service_started
      llama:
        condition: service_started

  ai-beat:
    build: ./backend
    container_name: ai-beat
    command: uv run celery -A app.integration.celery.celery_app beat --loglevel=INFO
    restart: unless-stopped
    env_file: ./backend/.env.docker
    volumes:
      - ./backend/app:/app/app
    depends_on:
      redis:
        condition: service_healthy

  ai-observer:
    build: ./backend
    container_name: ai-observer
    command: uv run celery -A app.integration.celery.celery_app worker --queues=ai_observer --concurrency=1 --loglevel=INFO
    restart: unless-stopped
    env_file: ./backend/.env.docker
    volumes:
      - ./backend/app:/app/app
    depends_on:
      redis:
        condition: service_healthy
      livekit:
        condition: service_started

  ai-transcriber:
    build: ./backend
    container_name: ai-transcriber
    command: uv run celery -A app.integration.celery.celery_app worker --queues=ai_transcriber --concurrency=1 --loglevel=INFO
    restart: unless-stopped
    env_file: ./backend/.env.docker
    volumes:
      - ./backend/app:/app/app
      - whisper_data:/root/.cache/huggingface
    depends_on:
      redis:
        condition: service_healthy
      livekit:
        condition: service_started

  tidb:
    image: pingcap/tidb:v8.5.0
    container_name: tidb
    restart: unless-stopped
    ports:
      - "4000:4000"
      - "10080:10080"
    command:
      - --store=unistore
      - --path=/data
    volumes:
      - tidb_data:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:10080/status" ]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  livekit:
    image: livekit/livekit-server:latest
    container_name: livekit
    command: --config /etc/livekit.yaml --node-ip 192.168.1.9
    restart: unless-stopped
    environment:
      NODE_IP: 192.168.1.9
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50100:50000-50100/udp"
      - "3478:3478/udp"
      - "5349:5349"
    volumes:
      - ./backend/livekit.yaml:/etc/livekit.yaml:ro
    depends_on:
      redis:
        condition: service_healthy

  llama:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: llama
    entrypoint: ["/app/llama-server"]
    command: ["-hf", "unsloth/gemma-4-E4B-it-qat-GGUF:UD-Q4_K_XL", "--host", "0.0.0.0", "--port", "8012", "-c", "8192"]
    restart: unless-stopped
    ports:
      - "8012:8012"
    volumes:
      - llama_data:/root/.cache/huggingface

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "3000:3000"
    restart: unless-stopped
    environment:
      REACT_APP_API_BASE_URL: http://localhost:8000/api/v1
      REACT_APP_WS_BASE_URL: ws://localhost:8000
    stdin_open: true
    tty: true

volumes:
  redis_data:
  minio_data:
  tidb_data:
  llama_data:
  whisper_data:
  qdrant_data:
